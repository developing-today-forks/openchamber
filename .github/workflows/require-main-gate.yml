name: Require successful main gate

on:
  workflow_call:
    inputs:
      release_sha:
        description: Commit SHA that will be published
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  require-main-gate:
    name: Require successful pr checks run
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Require successful main-gate result
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: bash .github/scripts/require-main-gate.sh

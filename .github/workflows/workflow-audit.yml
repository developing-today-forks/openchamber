name: workflow audit

# The recurrence guard for #1399 (and #118 before it): a reusable-workflow
# caller job carrying a key GitHub does not allow (timeout-minutes is the
# classic case) invalidates the whole workflow file, and every run fails
# at startup with zero jobs. This audit runs on any change that could
# reintroduce one, so it fails a PR check instead of merging to main.

# Read-only: this job checks out the PR head (including fork PRs) and runs the
# checked-out audit scripts with the default token, so pin the token scope here
# instead of inheriting whatever the repository default happens to be.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/audit-workflow-caller-jobs.py"
      - ".github/scripts/test-audit-workflow-caller-jobs.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/audit-workflow-caller-jobs.py"
      - ".github/scripts/test-audit-workflow-caller-jobs.sh"

jobs:
  caller-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the audit itself
        run: bash .github/scripts/test-audit-workflow-caller-jobs.sh
      - name: Audit every workflow for invalid caller jobs
        run: python3 .github/scripts/audit-workflow-caller-jobs.py .github/workflows
